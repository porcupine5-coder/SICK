name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96
      - name: Check formatting
        run: cargo fmt --check
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test
